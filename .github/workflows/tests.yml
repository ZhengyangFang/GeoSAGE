name: Tests
on: [push, pull_request]
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[dev]" build
      - run: python -m ruff check --select E9,F63,F7,F82 .
      - run: python -m pytest -q
      - run: python -m build

  studio-integration:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: geohang/PyHydroGeophysX
          ref: e8c0c5cec1e4bb6cb4bdcbfabf69f279814d0ac2
          path: .upstream-phgx
          sparse-checkout: PyHydroGeophysX
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -c constraints-tested.txt ".[dev]" ./.upstream-phgx
      - run: python -m pytest tests/test_studio_integration.py -q
