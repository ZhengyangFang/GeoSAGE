name: Tests
on: [push, pull_request]
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[dev]" build
      - run: python -m ruff check --select E9,F63,F7,F82 .
      - run: python -m pytest -q
      - run: python -m build

  studio-integration:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: geohang/PyHydroGeophysX
          ref: 098a61784a703db269df50f40e23b069afe8863b
          path: .upstream-phgx
          sparse-checkout: PyHydroGeophysX
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -c constraints-tested.txt ".[dev]" ./.upstream-phgx
      - run: python -m pytest tests/test_studio_integration.py tests/test_studio_validation.py tests/test_studio_experience.py tests/test_studio_task_regressions.py tests/test_studio_handoffs.py tests/test_studio_cli.py -q

  studio-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          # Companion implementation pending upstream review. Keep the
          # unmodified-upstream compatibility job above as a separate check.
          repository: ZhengyangFang/PyHydroGeophysX
          ref: 3f617cbede9dd37affe232f6485da228f116b25c
          path: .upstream-phgx
          sparse-checkout: |
            PyHydroGeophysX
            tests
            examples/data/EM/synthetic_tem_lci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      # Upstream source tests locate their public fixtures beside the package.
      # Keep that package in its checkout; GeoSAGE itself is still wheel-installed.
      - run: python -m pip install -c constraints-tested.txt ".[dev]" -e "./.upstream-phgx[desktop,desktop-3d]"
      - run: >-
          python -m pytest tests
          .upstream-phgx/tests/test_agents.py
          .upstream-phgx/tests/test_geosage_plugin.py
          .upstream-phgx/tests/test_assistant_desktop_extensions.py
          .upstream-phgx/tests/test_scientific_sections.py
          .upstream-phgx/tests/test_saved_result_previews.py
          .upstream-phgx/tests/test_studio_diagnostics.py
          .upstream-phgx/tests/test_cli_providers.py
          .upstream-phgx/tests/test_cli_setup.py -q
